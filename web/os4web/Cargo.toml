[package]
name = "os4web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "os4web"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.21"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = "0.13.4"
