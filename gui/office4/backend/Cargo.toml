[package]
name = "office4-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "office4-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.18", features = ["handshake"] }
tungstenite = { version = "0.18", default-features = false, features = ["handshake"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
url = "=2.4.1"
